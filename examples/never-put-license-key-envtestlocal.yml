  code: |
    // tests/lib/app.ts
    /**
     * The license key a Pro run launches with.
     *
     * A real key against the production backend rather than a stub. CI passes it
     * as a repository secret; a local run keeps it in `.env.test.local`, which
     * the `test:e2e` script reads through `bun --env-file`.
     */
    export function useProApp(seedConfig: SeedConfig = {}) {
      return useApp({ licenseKey: requireLicenseKey(), ...seedConfig });
    }

