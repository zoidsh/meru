    // tests/lib/app.ts
    function requireLicenseKey() {
      const licenseKey = process.env.MERU_TEST_LICENSE_KEY;

      if (!licenseKey) {
        throw new Error(
          "MERU_TEST_LICENSE_KEY is not set. CI passes it as a repository secret; a local run reads it from .env.test.local.",
        );
      }

      return licenseKey;
    }

