  code: |
    /*
     * What the app ships, in bytes, against a budget kept next to this file.
     *
     * A bundle is the same number of bytes on every machine that builds it, so
     * this one can hold a checked-in budget and fail when the build outgrows it.
     */
    import { expect, test } from "@playwright/test";
    import budget from "./bundle-budget.json";

    test("every bundle stays inside its budget", async () => {
      const sizes = await measureBundles();

      expect(sizes.preloadGmail).toBeLessThanOrEqual(budget.preloadGmail);
    });

