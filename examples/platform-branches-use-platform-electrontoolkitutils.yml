- label: ok
  lang: ts
  note: "`@meru/electron-extensions` is the app-agnostic package, so it has no `@/lib/utils` and does not take the Electron toolkit for one branch. Should an app-agnostic package be held to the helper as well, or is a raw `process.platform` the right call there?"
  code: |
    // packages/electron-extensions/native-messaging/host.ts
    private getArguments(extensionOrigin: string) {
      if (process.platform === "win32") {
        // Chrome passes the calling window's handle on Windows, and hosts that
        // parent a dialog on it expect the argument to be there
        return [extensionOrigin, "--parent-window=0"];
      }

      return [extensionOrigin];
    }

