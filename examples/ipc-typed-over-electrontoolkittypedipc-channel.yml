- label: violation
  lang: ts
  code: |
    // packages/app/account.ts
    const ipcEvent = "desktopSources.select";

    const ipcListener = (_event: IpcMainEvent, desktopSource: SelectedDesktopSource) => {
      desktopSourcesWindow.removeListener(windowEvent, windowListener);

      callback({ video: desktopSource });

      desktopSourcesWindow.destroy();
    };

    ipcMain.once(ipcEvent, ipcListener);
  lines: [11]
  note: >-
    Labelled violation because the receive goes through raw ipcMain with a hand-written event
    signature rather than the typed listener, even though the channel is declared in the map and
    named correctly. This is code that ships in packages/app/account.ts today, where the desktop
    picker needs a one-shot listener it can also remove. Question for Tim, should a one-shot
    ipcMain.once for a declared channel count as a sanctioned exception, and if so should the
    criteria say so?

