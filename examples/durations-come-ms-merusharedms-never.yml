- label: violation
  lang: ts
  lines: [8, 13]
  note: >-
    Judging hand-rolled millisecond arithmetic as a violation of the first half of the sentence, in a
    file that already imports the vendored helper. Should raw arithmetic count, or is the tenet only
    about the npm package?
  code: |
    // packages/app/downloads.ts
    import { ms } from "@meru/shared/ms";
    import { config } from "@/config";

    export function initDownloadHistoryCleanup() {
      const cleanupDownloadsHistory = () => {
        const now = Date.now();
        const history = config.get("downloads.history").filter(
          (item) => now - item.createdAt * 1000 < 30 * 24 * 60 * 60 * 1000,
        );

        config.set("downloads.history", history);
      };

      setInterval(cleanupDownloadsHistory, 24 * 60 * 60 * 1000);
    }

