- label: ok
  lang: ts
  note: The vendored copy is the helper itself; its header names the upstream project it was copied from.
  code: |
    // packages/shared/ms.ts
    /*
     * https://github.com/vercel/ms
     */

    const s = 1000;
    const m = s * 60;
    const h = m * 60;
    const d = h * 24;
    const w = d * 7;

    export function ms(value: StringValue | number, options?: Options): number | string {
      if (typeof value === "string" && value.length > 0) {
        return parse(value);
      }

      throw new Error(`Value provided to ms() must be a string or number.`);
    }

