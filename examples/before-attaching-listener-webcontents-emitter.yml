    // packages/app/notifications.ts
    function attachNotificationListeners(
      notification: Notification,
      { click, action }: { click?: () => void; action?: (index: number) => void },
    ) {
      if (click) {
        notification.once("click", click);
      }

      if (action) {
        notification.once("action", (_event, index) => {
          action(index);
        });
      }
    }

    export function createNewEmailNotification(options: NotificationConstructorOptions) {
      const notification = new Notification(options);

      attachNotificationListeners(notification, { click, action });

      if (sound !== "system" && playSound) {
        notification.once("show", () => {
          ipc.renderer.send(main.window.webContents, "notifications.playSound", { sound });
        });
      }

      notification.show();
    }
