name: bun install
description: Installs dependencies with Bun's install cache restored

inputs:
  args:
    description: Extra arguments for bun install
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The temp directory shares a drive with the checkout on Windows, D:, where
    # Bun's default under the home directory is on C:, and Bun can only link
    # packages rather than copy them within one drive.
    - uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/bun-install-cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      env:
        BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        ARGS: ${{ inputs.args }}
      run: bun install --frozen-lockfile $ARGS
