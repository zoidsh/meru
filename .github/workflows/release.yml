name: release

on:
  release:
    types:
      - prereleased
      - released

jobs:
  # Stable releases are cut on main and betas on the beta branch, and the build
  # picks the update feed from the prerelease flag alone. A beta edited into a
  # full release, or a release cut on the wrong branch, would otherwise publish
  # onto the other channel's feed: `latest*.yml` carrying a `-beta.N` version,
  # or a stable shipping features main has not taken yet.
  channel:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          case "$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)" in
            ahead | identical) on_main=true ;;
            *) on_main=false ;;
          esac
          if [ "$PRERELEASE" = true ]; then
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              echo "::error::A prerelease is tagged vX.Y.Z-beta.N, and $TAG is not."
              exit 1
            fi
            if [ "$on_main" = true ]; then
              echo "::error::$TAG is on main. A beta is cut on the beta branch."
              exit 1
            fi
          else
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::A stable release is tagged vX.Y.Z, and $TAG is not. A beta is never promoted by editing it into a release."
              exit 1
            fi
            if [ "$on_main" = false ]; then
              echo "::error::$TAG is not on main. A stable release is cut on main."
              exit 1
            fi
          fi
  ci:
    needs: channel
    uses: ./.github/workflows/ci.yml
    # Reusable workflows get none of the caller's secrets without this,
    # so the e2e job would run without a license key and fail the release.
    secrets: inherit
  build:
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - if: startsWith(matrix.os, 'macos')
        run: bun run build:mac -- --publish always ${{ github.event.release.prerelease && '--config.publish.channel=beta' || '' }}
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uploads into a release published over two hours ago; without it a
          # re-run skips every asset and still exits zero.
          EP_GH_IGNORE_TIME: true
      - if: startsWith(matrix.os, 'ubuntu') && !github.event.release.prerelease
        # A prerelease keeps an empty .upd_info, because the update information
        # resolves `latest` to the newest non-prerelease and would move beta
        # users onto stable. It runs before the build because the runtime it
        # patches goes into the sha512 electron-builder publishes, and zsync is
        # installed here so an apt failure stops the job before anything is
        # uploaded. The apt lists are a snapshot, and a superseded package
        # there 404s without an update first.
        run: |
          sudo apt-get update && sudo apt-get install -y zsync
          bun scripts/appimage/update-info.ts "$RUNNER_TEMP/appimage-tools"
          echo "APPIMAGE_TOOLS_PATH=$RUNNER_TEMP/appimage-tools" >> "$GITHUB_ENV"
      - if: startsWith(matrix.os, 'ubuntu')
        run: bun run build:linux -- --publish always ${{ github.event.release.prerelease && '--config.publish.channel=beta' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uploads into a release published over two hours ago; without it a
          # re-run skips every asset and still exits zero.
          EP_GH_IGNORE_TIME: true
      - if: startsWith(matrix.os, 'ubuntu') && !github.event.release.prerelease
        run: bun scripts/appimage/zsync.ts "${{ github.event.release.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: startsWith(matrix.os, 'windows')
        run: bun run build:win -- --publish always ${{ github.event.release.prerelease && '--config.publish.channel=beta' || '' }}
        env:
          # Azure Artifact Signing authenticates through the Azure SDK's
          # EnvironmentCredential, which reads exactly these three names.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uploads into a release published over two hours ago; without it a
          # re-run skips every asset and still exits zero.
          EP_GH_IGNORE_TIME: true
