name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run fmt:check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run types:ci
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # test:e2e builds the app first, unpacked and x64 only: it launches the
      # app rather than installing it, so packing installers for two
      # architectures would be time spent on output no test opens. The runner
      # image ships Xvfb; -a takes a free display rather than colliding on :99.
      - run: xvfb-run -a bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          if-no-files-found: ignore
          # The trace opens in the trace viewer and is the thing worth having;
          # the report is the readable index into it.
          path: |
            test-results/
            playwright-report/
