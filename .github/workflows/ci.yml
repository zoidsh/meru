name: ci

on:
  push:
    branches: [v4]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each timeout is about three times the job's measured duration, rounded up.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          electron: false
      - run: pnpm lint --format github
      - run: pnpm fmt:check
      - run: pnpm types
      - run: pnpm i18n:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          electron: false
      - run: pnpm test

  e2e:
    name: e2e-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, runner: ubuntu-latest, timeout: 3 }
          - { name: windows, runner: windows-latest, timeout: 5 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pnpm test:e2e
      # always(), not failure(): a job killed for its timeout counts as
      # cancelled, and its trace is the one most worth having.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.name }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  installers:
    name: installers-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, runner: macos-latest, timeout: 8 }
          - { name: windows, runner: windows-latest, timeout: 15 }
          - { name: linux, runner: ubuntu-latest, timeout: 12 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm package:installers
