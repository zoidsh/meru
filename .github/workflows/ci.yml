name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

# One run per pull request, with a superseded one cancelled rather than left to
# finish. Two pushes seconds apart otherwise pay for three app builds on a
# commit that has already been replaced.
#
# Everything else gets a group of its own, because `run_id` is unique to a run:
# a push to main and a release build never wait on each other, which is what a
# shared group without cancellation would make them do.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run fmt:check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run types:ci
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
  e2e:
    # Builds the app and launches it, so this is also what proves each platform
    # still compiles. There is no separate build workflow: building without
    # launching proved strictly less, and a signed build is only needed at
    # release, which release.yml does itself.
    runs-on: ${{ matrix.os }}
    # A test that hangs rather than fails would otherwise sit on a runner for
    # GitHub's six hour default. Two attempts of a two minute test, its build
    # and its teardown fit inside this several times over.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Only Linux needs a display server invented for it. -a takes a free
      # display rather than colliding on :99.
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:e2e
        env:
          MERU_TEST_LICENSE_KEY: ${{ secrets.MERU_TEST_LICENSE_KEY }}
      - if: runner.os != 'Linux'
        run: bun run test:e2e
        env:
          MERU_TEST_LICENSE_KEY: ${{ secrets.MERU_TEST_LICENSE_KEY }}
      # always(), not failure(): a job killed for running long counts as
      # cancelled rather than failed, and that is the run whose trace is most
      # worth having.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          if-no-files-found: ignore
          # The trace opens in the trace viewer and is the thing worth having;
          # the report is the readable index into it.
          path: |
            test-results/e2e/
            playwright-report/e2e/
