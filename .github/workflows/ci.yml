name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

# One run per pull request, with a superseded one cancelled rather than left to
# finish. Two pushes seconds apart otherwise pay for three app builds on a
# commit that has already been replaced.
#
# Everything else gets a group of its own, because `run_id` is unique to a run:
# a push to main, a dispatched run and a release build never wait on each
# other, which is what a shared group without cancellation would make them do.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request touches anything lint, types, test and e2e
  # could catch a break in. It lists files that cannot break the app rather
  # than files that can, so a path nobody thought of runs everything instead of
  # shipping untested. fmt runs regardless, because oxfmt formats markdown.
  #
  # Only a pull request is gated. A push to main is the run the release skill
  # reads as main's build check, and a docs-only commit skipping there would
  # turn a red commit beneath it green; a release and a dispatched run must
  # never skip either. The whole pull request's files count, not the latest
  # push's, because a superseded run is cancelled before it finishes. A rename
  # counts its old path too, so a source file renamed to markdown still runs.
  #
  # No permissions block: release.yml calls this workflow with a token that
  # holds no pull-requests scope, and a called job asking for more than its
  # caller has rejects the whole release run before it starts. The repository
  # is public, so the files list needs no scope.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ] && files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "$files"
            echo "$files" | grep -qvE '\.md$|^\.claude/|^LICENSE$' || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run fmt:check
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
  # The three catalog checks, in the order they answer: whether the committed
  # PO is what `lingui extract` would write, whether anything is untranslated,
  # and whether a translation drifted from its source in a way Lingui itself
  # does not look at.
  i18n:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx lingui compile --strict
      - run: bunx lingui check sync --clean --workers 1
      - run: bunx lingui check missing --mode catalog --verbose --workers 1
      - run: bun run i18n:check
  types:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run types:ci
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
  e2e:
    # Builds the app and launches it, so this is also what proves each platform
    # still compiles. There is no separate build workflow: building without
    # launching proved strictly less, and a signed build is only needed at
    # release, which release.yml does itself.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # A test that hangs rather than fails would otherwise sit on a runner for
    # GitHub's six hour default. Two attempts of a two minute test, its build
    # and its teardown fit inside this several times over.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      # Only Linux needs a display server invented for it. -a takes a free
      # display rather than colliding on :99.
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:e2e
        env:
          MERU_TEST_LICENSE_KEY: ${{ secrets.MERU_TEST_LICENSE_KEY }}
      - if: runner.os != 'Linux'
        run: bun run test:e2e
        env:
          MERU_TEST_LICENSE_KEY: ${{ secrets.MERU_TEST_LICENSE_KEY }}
      # always(), not failure(): a job killed for running long counts as
      # cancelled rather than failed, and that is the run whose trace is most
      # worth having.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          if-no-files-found: ignore
          # The trace opens in the trace viewer and is the thing worth having;
          # the report is the readable index into it.
          path: |
            test-results/
            playwright-report/
