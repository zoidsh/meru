name: build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    paths-ignore:
      - "**.md"

jobs:
  build:
    # Signing and notarizing macOS adds ~4 minutes to a run, so pull request builds are
    # unsigned by default: label a pull request `sign-macos` to sign that build and every
    # build after it. Only that label starts a run; any other label is ignored.
    if: github.event.action != 'labeled' || github.event.label.name == 'sign-macos'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    env:
      SIGN_MACOS: ${{ contains(github.event.pull_request.labels.*.name, 'sign-macos') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # What this job is for is catching a platform that no longer compiles, which
      # `--dir` establishes: it runs the whole pipeline and stops before packing
      # installers. One architecture is enough for that, and the runner's own costs
      # nothing to cross-compile. Releases still build every target and architecture,
      # in release.yml, which shares no jobs with this workflow.
      #
      # Linux is absent because ci.yml's e2e job already builds it the same way
      # before launching what it built, so a job here would build it twice. It
      # stays in ci.yml rather than moving here because release.yml runs ci.yml
      # and would otherwise stop running the tests.
      - if: startsWith(matrix.os, 'macos') && env.SIGN_MACOS != 'true'
        run: bun run build:mac -- --dir --arm64 --publish never
      - if: startsWith(matrix.os, 'windows')
        run: bun run build:win -- --dir --x64 --publish never
      # The signed path stays whole, because the point of the label is to come away
      # with something installable: a signed build that is never packed into a dmg
      # cannot be tested, and notarization is the part most worth proving early.
      - if: startsWith(matrix.os, 'macos') && env.SIGN_MACOS == 'true'
        # The provisioning profile authorizes the Touch ID keychain access group entitlement;
        # without it macOS refuses to launch the signed app.
        run: |
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > build/embedded.provisionprofile
          bun run build:mac -- --publish never
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          # electron-builder skips signing on PR builds unless this is true; fork PRs never
          # receive the secrets, so they still fall back to an unsigned build.
          CSC_FOR_PULL_REQUEST: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # One artifact per installer, uncompressed: installers are already compressed, and a
      # bundled artifact forces downloading every file to test one. Auto-update zips and
      # blockmaps are omitted — only the release publish flow needs them.
      - if: startsWith(matrix.os, 'macos') && env.SIGN_MACOS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Meru-mac-x64.dmg
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.dmg
            !dist/*-arm64.dmg
      - if: startsWith(matrix.os, 'macos') && env.SIGN_MACOS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Meru-mac-arm64.dmg
          if-no-files-found: error
          compression-level: 0
          path: dist/*-arm64.dmg
