    /*
     * Chromium hands the check handler `GURL::spec()`, which for a standard
     * scheme such as `chrome-extension:` carries the trailing slash the
     * manifest omits.
     */
    export function matchesResource(url: string, pattern: string) {
      return new URL(url).pathname === pattern;
    }

