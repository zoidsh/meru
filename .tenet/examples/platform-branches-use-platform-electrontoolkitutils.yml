- label: ok
  lang: ts
  note: Every branch goes through the helper; the raw value is only interpolated into the error text.
  code: |
    import { platform } from "@electron-toolkit/utils";

    async function readMachineId() {
      if (platform.isMacOS) {
        return parseIoregOutput(await readIoreg());
      }

      if (platform.isWindows) {
        return parseRegOutput(await readRegistry());
      }

      if (platform.isLinux) {
        return normalizeLinuxId(await readLinuxMachineId());
      }

      throw new Error(`Unsupported platform: ${process.platform}`);
    }

