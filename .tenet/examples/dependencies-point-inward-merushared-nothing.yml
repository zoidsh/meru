# Labelled cases for the dependencies-point-inward-merushared-nothing tenet, measured by `tenet check`.
- label: violation
  lang: ts
  lines: 3
  note: A type-only import still makes the renderer package depend on the main-process package; the type belongs in @meru/shared.
  code: |
    // packages/renderer/lib/stores.ts
    import { ipc } from "@meru/shared/renderer/ipc";
    import type { AccountConfig } from "@meru/app/config";
    import { create } from "zustand";

    export const useAccountsStore = create<{ accounts: AccountConfig[] }>(() => ({
      accounts: [],
    }));

    ipc.renderer.on("accounts.changed", (_event, accounts) => {
      useAccountsStore.setState({ accounts });
    });
