- label: ok
  lang: ts
  note: The main process loads the renderer's built HTML as a file; naming another package in a path string is not an import of it.
  code: |
    // packages/app/lib/window.ts
    import path from "node:path";
    import { is } from "@electron-toolkit/utils";
    import { BrowserWindow } from "electron";

    export function loadRenderer(window: BrowserWindow, searchParams: URLSearchParams) {
      if (is.dev && process.env.ELECTRON_RENDERER_URL) {
        return window.loadURL(`${process.env.ELECTRON_RENDERER_URL}/main.html?${searchParams}`);
      }

      return window.loadFile(path.join(__dirname, "../renderer/main.html"), {
        search: searchParams.toString(),
      });
    }
