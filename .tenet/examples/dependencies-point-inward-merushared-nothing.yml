    // packages/shared/tabs.ts
    import { useTabsStore } from "@meru/renderer/lib/stores";
    import { VERTICAL_TABS_NARROW_WIDTH } from "./constants";
    import type { AccountConfig } from "./schemas";

    export function getVisibleVerticalTabs(account: AccountConfig) {
