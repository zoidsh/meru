- label: ok
  lang: ts
  note: packages/electron-extensions/alarms/schedule.ts. The same standalone package, converting the minutes chrome.alarms speaks in into the milliseconds a timer takes.
  code: |
    import type { AlarmCreateInfo } from "./bridge-protocol";

    const MS_PER_MINUTE = 60_000;

    export function createAlarmSchedule(info: AlarmCreateInfo, now: number) {
      const delayInMinutes = readNumber(info.delayInMinutes);

      return { scheduledTime: now + (delayInMinutes ?? 0) * MS_PER_MINUTE };
    }

