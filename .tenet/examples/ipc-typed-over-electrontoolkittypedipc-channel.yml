    import { ipc } from "@meru/shared/renderer/ipc";

    export function WorkspaceAppToolbar({ workspaceAppId }: { workspaceAppId: string }) {
      const [isLoading, setIsLoading] = useState(false);

      useEffect(() => {
        const unsubscribe = ipc.renderer.on("workspaceApp.loadingStateChanged", (_event, loading) => {
          setIsLoading(loading);
        });

        ipc.main.invoke("workspaceApp.getLoadingState", workspaceAppId).then(setIsLoading);

        return unsubscribe;
      }, [workspaceAppId]);

      return <Button onClick={() => ipc.main.send("workspaceApp.reload", workspaceAppId)} />;
    }

- label: ok
  lang: ts
  note: "A content preload listening and replying on declared channels through the typed client. Preloads never register main-process handlers, so this is not an ipc.init() case."
  code: |
    import { ipc } from "@meru/shared/renderer/ipc";
    import { refreshInbox, sendMailAction } from "./inbox";

    ipc.renderer.on("gmail.navigateTo", (_event, destination) => {
      window.location.hash = `#${destination}`;
    });

    ipc.renderer.on("gmail.handleMessage", async (_event, messageId, action, requestId) => {
      let success = true;

      try {
        await sendMailAction(messageId, action);

        refreshInbox();
      } catch {
        success = false;
      }

      ipc.main.send("gmail.messageHandled", requestId, success);
    });

