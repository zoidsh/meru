- label: violation
  lang: ts
  note: "Raw ipcMain.handle in a main module: the channel bypasses the typed listener and never reaches the shared map."
  lines: 6
  code: |
    import { dialog, ipcMain } from "electron";
    import { config } from "@/config";

    class Downloads {
      init() {
        ipcMain.handle("downloads.setLocation", async () => {
          const { canceled, filePaths } = await dialog.showOpenDialog({
            properties: ["openDirectory"],
          });

          if (!canceled) {
            config.set("downloads.location", filePaths[0]);
          }

          return { canceled };
        });
      }
    }

