  lang: ts
  note: Every listener the popup adds is taken off again in close(), and no event repeats on a target.
  code: |
    open(parentWindow: BrowserWindow, options: PopupOptions) {
      this.view.webContents.once("blur", this.handleBlur);

      parentWindow.on("resize", this.setBounds);

      parentWindow.once("closed", this.close);
    }

    close = () => {
      parentWindow.removeListener("resize", this.setBounds);

      parentWindow.removeListener("closed", this.close);

      view.webContents.off("blur", this.handleBlur);
    };
- label: ok
  lang: ts
  note: A factory, so each window adds its own nativeTheme listener and drops it when that window closes.
  code: |
    export function createBrowserWindow(options: BrowserWindowConstructorOptions) {
      const browserWindow = new BrowserWindow({ show: false, ...options });

      browserWindow.once("ready-to-show", () => {
        browserWindow.show();
      });

      if (options.backgroundColor) {
        const updateBackgroundColor = () => {
          browserWindow.setBackgroundColor(getBackgroundColor());
        };

        nativeTheme.on("updated", updateBackgroundColor);

        browserWindow.once("closed", () => {
          nativeTheme.off("updated", updateBackgroundColor);
        });
      }

      return browserWindow;
    }
