    export function logLoadFailures(webContents: WebContents, name: string) {
      webContents.on("did-fail-load", (_event, errorCode, errorDescription) => {
        log.error(`${name} failed to load`, { errorCode, errorDescription });
      });

      webContents.on("render-process-gone", (_event, { reason }) => {
        log.error(`${name} renderer is gone`, { reason });
      });

      webContents.on("did-fail-load", (_event, errorCode, _description, url, isMainFrame) => {
        if (isMainFrame) {
          log.info("Retrying after a failed main-frame load", { url, errorCode });
        }
      });
    }
