    private subscribeToSelectedAccount() {
      const gmailWebContents = accounts.getSelectedAccount().instance.gmail.view.webContents;

      const refreshMenu = () => {
        this.refresh();
      };

      gmailWebContents.on("did-navigate-in-page", refreshMenu);

      this.selectedAccountUnsubscribeFns.add(() => {
        gmailWebContents.removeListener("did-navigate-in-page", refreshMenu);
      });
    }
