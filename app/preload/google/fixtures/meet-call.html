<!--
  Hand-made, not captured: only the markers the feature is anchored on, in the order Meet lays its controls out. A capture of a call's controls, into app/preload/google/fixtures/captured/meet-call.html, replaces it.
-->
<div role="region" aria-label="Call controls">
  <button data-is-muted="false" aria-label="Turn off microphone"></button>
  <button data-is-muted="false" aria-label="Turn off camera"></button>
  <button aria-label="Leave call"></button>
</div>
