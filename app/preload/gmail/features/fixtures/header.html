<!--
  Hand-made, not captured: only the markers the feature is anchored on, in the shape Gmail's own markup puts them in. A capture of the header of a signed-in mailbox, into app/preload/gmail/fixtures/captured/header.html, replaces it.
-->
<header role="banner">
  <div class="gb_Rd">
    <div class="gb_Sd">
      <a href="#inbox" aria-label="Gmail"><img src="logo.png" alt="Gmail" /></a>
    </div>
  </div>
  <div class="gb_Td">
    <form role="search"><input aria-label="Search mail" /></form>
  </div>
</header>
