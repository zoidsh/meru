# The hook script is shared by every worktree; scripts/install-hooks.ts writes
# one that names no worktree, and lefthook must not rewrite it on each run.
no_auto_install: true

pre-commit:
  commands:
    fmt:
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
